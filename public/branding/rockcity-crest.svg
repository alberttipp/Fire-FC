<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Rock City FC">
  <defs>
    <linearGradient id="rcNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16305c"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="rcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dc94"/>
      <stop offset="0.5" stop-color="#d8b458"/>
      <stop offset="1" stop-color="#9c7a2e"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M120 6 L226 34 V158 C226 224 178 266 120 288 C62 266 14 224 14 158 V34 Z"
        fill="url(#rcNavy)" stroke="url(#rcGold)" stroke-width="8"/>
  <path d="M120 20 L214 44 V158 C214 216 172 254 120 272 C68 254 26 216 26 158 V44 Z"
        fill="none" stroke="#c9a24b" stroke-width="1.5" opacity="0.5"/>

  <!-- top banner -->
  <rect x="34" y="46" width="172" height="34" rx="5" fill="url(#rcGold)"/>
  <text x="120" y="70" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="22" font-weight="900" letter-spacing="1" fill="#0a1730">ROCK CITY</text>

  <!-- RC monogram (gold) -->
  <text x="120" y="182" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="96" font-weight="900" fill="url(#rcGold)" letter-spacing="-3">RC</text>

  <!-- ROCKFORD IL banner -->
  <rect x="52" y="206" width="136" height="22" rx="4" fill="#0a1730" stroke="#c9a24b" stroke-width="1.5"/>
  <text x="120" y="222" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="13" font-weight="800" letter-spacing="3" fill="url(#rcGold)">ROCKFORD IL</text>

  <!-- EST + FC -->
  <text x="120" y="246" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="2" fill="#cbd5e1">EST. 2024</text>
  <g transform="translate(120,266)">
    <circle r="15" fill="url(#rcGold)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
          font-size="14" font-weight="900" fill="#0a1730">FC</text>
  </g>
</svg>
